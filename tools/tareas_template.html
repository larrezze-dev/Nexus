<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS · Tareas</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c2330;--mute:#667085;--line:#e3e7ed;--ok:#1a9d5a;--wip:#d98a00;--todo:#b8c0cc;--acc:#2f5bea;--bad:#d64545;--track:#e8ecf2}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#11151c;--card:#1a2029;--fg:#e8ecf2;--mute:#97a1b0;--line:#2a3340;--ok:#3ccf85;--wip:#f0a73a;--todo:#4a5465;--acc:#6f8dff;--bad:#ff7b7b;--track:#2a3340}}
:root[data-theme=dark]{--bg:#11151c;--card:#1a2029;--fg:#e8ecf2;--mute:#97a1b0;--line:#2a3340;--ok:#3ccf85;--wip:#f0a73a;--todo:#4a5465;--acc:#6f8dff;--bad:#ff7b7b;--track:#2a3340}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:22px;margin:0 0 2px}h2{font-size:17px;margin:32px 0 12px}
.sub{color:var(--mute);font-size:13px;margin-bottom:20px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .v{font-size:30px;font-weight:650;line-height:1.1}.kpi .l{color:var(--mute);font-size:13px}.kpi .d{color:var(--mute);font-size:12px;margin-top:4px}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.w{background:var(--wip)}
.row{display:grid;grid-template-columns:170px 1fr 70px;gap:12px;align-items:center;padding:6px 0;font-size:14px}
.row .n{color:var(--mute);font-size:12px;text-align:right}
.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:550;font-size:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line);white-space:nowrap}
.s-Aprobado{color:var(--ok);border-color:var(--ok)}.s-Gate,.s-En,.s-wip{color:var(--wip);border-color:var(--wip)}
.s-Pendiente{color:var(--mute)}.s-Bloqueado{color:var(--bad);border-color:var(--bad)}
.chip{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:5px;font-size:11px;font-weight:600;margin-right:3px;background:var(--track);color:var(--mute)}
.chip.on{background:var(--ok);color:#fff}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
summary{cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:1fr 160px 80px;gap:12px;align-items:center;font-weight:600}
summary .meta{font-weight:400;color:var(--mute);font-size:13px;text-align:right}
details .inner{padding:0 8px 8px;overflow-x:auto}
.mini{width:90px}
.mute{color:var(--mute)}
button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;font-size:13px}
@media(max-width:640px){.row{grid-template-columns:110px 1fr 56px}summary{grid-template-columns:1fr 70px}summary .bar{display:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const D=/*DATA*/null;
const $=(t,a={},h='')=>{const e=document.createElement(t);Object.assign(e,a);e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bar=(ok,wip=0)=>`<div class="bar"><i style="width:${ok}%"></i><i class="w" style="width:${wip}%"></i></div>`;
const cls=s=>'s-'+s.split(' ')[0];
const A=document.getElementById('app');
let h=`<h1>NEXUS · Panel de tareas</h1><div class="sub">Generado desde docs/steps/STATUS.md · tools/gen_tareas.py · ${esc(new Date().toISOString().slice(0,10))}</div>`;

/* 1. Dashboard */
const wipPct=(D.n_wip/D.n*100).toFixed(1);
h+=`<div class="grid kpis">
<div class="card kpi"><div class="l">Esfuerzo de codificación</div><div class="v">${D.pct_effort}%</div><div class="d">${D.done_u} de ${D.tot_u} tracks entregados</div>${bar(D.pct_effort)}</div>
<div class="card kpi"><div class="l">Tareas aprobadas</div><div class="v">${D.pct_tasks}%</div><div class="d">${D.n_ok} de ${D.n} pasos (aprobación de Luciano)</div>${bar(D.pct_tasks,+wipPct)}</div>
<div class="card kpi"><div class="l">En marcha / en revisión</div><div class="v">${D.n_wip}</div><div class="d">entregadas sin aprobar o parciales</div></div>
<div class="card kpi"><div class="l">Pasos con bloqueo declarado</div><div class="v">${D.blocked.length}</div><div class="d">ADR o preguntas ⚑ abiertas</div></div>
</div>`;

h+=`<div class="grid two" style="margin-top:12px">
<div class="card"><b>Por estado</b>${Object.entries(D.by_status).map(([k,v])=>`<div class="row" style="grid-template-columns:110px 1fr 40px"><span class="pill ${cls(k)}">${esc(k)}</span>${bar(v/D.n*100)}<span class="n">${v}</span></div>`).join('')}</div>
<div class="card"><b>Por track</b> <span class="mute" style="font-size:12px">(pasos con ese track entregado)</span>${Object.keys(D.tr_tot).map(t=>{const d=D.tr_done[t]||0,n=D.tr_tot[t];return `<div class="row" style="grid-template-columns:40px 1fr 60px"><span class="chip ${d?'on':''}">${t}</span>${bar(d/n*100)}<span class="n">${d}/${n}</span></div>`}).join('')}</div>
</div>`;

/* 2. Fases (alto nivel) */
h+=`<h2>Progreso por fase</h2><div class="card">${D.phases.map(p=>`<div class="row"><span><b>${esc(p.id)}</b> <span class="mute">${esc(p.name)}</span></span>${bar(p.pct)}<span class="n">${p.pct}% · ${p.ok}/${p.n}</span></div>`).join('')}</div>`;

/* 3. Hitos */
h+=`<h2>Hitos</h2><div class="card"><table><tr><th>Hito</th><th>Condición</th><th>Confirmado</th></tr>${D.milestones.map(m=>`<tr><td>${esc(m[0])}</td><td>${esc(m[1])}</td><td>${esc(m[2]||'—')}</td></tr>`).join('')}</table></div>`;

/* 4. Tareas por fase (bajo nivel) */
h+=`<h2>Planificación y tareas (orden cronológico)</h2>`;
D.phases.forEach((p,i)=>{
 const st=D.steps.filter(s=>s.phase===p.id);
 h+=`<details ${p.pct<100&&(i===0||st.some(s=>s.status!=='Pendiente'))?'open':''}><summary><span>${esc(p.id)} · ${esc(p.name)}</span>${bar(p.pct)}<span class="meta">${p.pct}%</span></summary><div class="inner"><table>
 <tr><th>Paso</th><th>Descripción</th><th>Tracks</th><th>Depende de</th><th>Estado</th><th>Avance</th></tr>
 ${st.map(s=>{
  const done=s.status==='Aprobado'||s.status==='En revisión';
  const chips=s.tracks.map(t=>`<span class="chip ${done||(s.status==='Gate C'&&t==='C')?'on':''}">${t}</span>`).join('');
  return `<tr><td><b>${s.id}</b> ${esc(s.title)}${s.note?`<div class="mute" style="font-size:12px">${esc(s.note)}</div>`:''}</td><td>${esc(s.desc)}</td><td>${chips}</td><td>${s.deps.join(', ')||'—'}</td><td><span class="pill ${cls(s.status)}">${esc(s.status)}</span>${s.date?`<div class="mute" style="font-size:12px">${esc(s.date)}</div>`:''}</td><td class="mini">${bar(s.pct)}<span class="mute" style="font-size:12px">${s.pct}%</span></td></tr>`}).join('')}
 </table></div></details>`;
});

/* 5. Preguntas abiertas */
h+=`<h2>Preguntas abiertas ⚑ que bloquean pasos</h2><div class="card" style="overflow-x:auto"><table><tr><th>Pregunta</th><th>Dónde</th><th>Bloquea</th></tr>${D.questions.map(q=>`<tr><td>${esc(q[0])}</td><td class="mute">${esc(q[1])}</td><td>${esc(q[2])}</td></tr>`).join('')}</table></div>`;
h+=`<p class="mute" style="font-size:12px;margin-top:24px">Esfuerzo = nº de tracks entregados / tracks totales (cada track pesa 1). Un paso cuenta como "aprobado" solo cuando Luciano lo marca <i>Aprobado</i>.</p>`;
A.innerHTML=h;
</script>
</body>
</html>
