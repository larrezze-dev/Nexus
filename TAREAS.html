<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS · Tareas</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c2330;--mute:#667085;--line:#e3e7ed;--ok:#1a9d5a;--wip:#d98a00;--todo:#b8c0cc;--acc:#2f5bea;--bad:#d64545;--track:#e8ecf2}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#11151c;--card:#1a2029;--fg:#e8ecf2;--mute:#97a1b0;--line:#2a3340;--ok:#3ccf85;--wip:#f0a73a;--todo:#4a5465;--acc:#6f8dff;--bad:#ff7b7b;--track:#2a3340}}
:root[data-theme=dark]{--bg:#11151c;--card:#1a2029;--fg:#e8ecf2;--mute:#97a1b0;--line:#2a3340;--ok:#3ccf85;--wip:#f0a73a;--todo:#4a5465;--acc:#6f8dff;--bad:#ff7b7b;--track:#2a3340}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:22px;margin:0 0 2px}h2{font-size:17px;margin:32px 0 12px}
.sub{color:var(--mute);font-size:13px;margin-bottom:20px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .v{font-size:30px;font-weight:650;line-height:1.1}.kpi .l{color:var(--mute);font-size:13px}.kpi .d{color:var(--mute);font-size:12px;margin-top:4px}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.w{background:var(--wip)}
.row{display:grid;grid-template-columns:170px 1fr 70px;gap:12px;align-items:center;padding:6px 0;font-size:14px}
.row .n{color:var(--mute);font-size:12px;text-align:right}
.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:550;font-size:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line);white-space:nowrap}
.s-Aprobado{color:var(--ok);border-color:var(--ok)}.s-Gate,.s-En,.s-wip{color:var(--wip);border-color:var(--wip)}
.s-Pendiente{color:var(--mute)}.s-Bloqueado{color:var(--bad);border-color:var(--bad)}
.chip{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:5px;font-size:11px;font-weight:600;margin-right:3px;background:var(--track);color:var(--mute)}
.chip.on{background:var(--ok);color:#fff}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
summary{cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:1fr 160px 80px;gap:12px;align-items:center;font-weight:600}
summary .meta{font-weight:400;color:var(--mute);font-size:13px;text-align:right}
details .inner{padding:0 8px 8px;overflow-x:auto}
.mini{width:90px}
.mute{color:var(--mute)}
button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;font-size:13px}
@media(max-width:640px){.row{grid-template-columns:110px 1fr 56px}summary{grid-template-columns:1fr 70px}summary .bar{display:none}}
</style>
</head>
<body>
<main id="app"></main>
