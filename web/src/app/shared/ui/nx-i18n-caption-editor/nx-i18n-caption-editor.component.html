<div
  class="nx-i18n-caption-editor"
  role="group"
  [class.nx-i18n-caption-editor--expanded]="expanded()"
  [attr.aria-label]="'shared.i18nCaptionEditor.groupLabel' | transloco"
>
  @for (lang of languages; track lang) {
    @if (lang === firstExtraLanguage) {
      <!-- Below 600 px only (§4.6): fr/it/es fold behind this button; it precedes them in the tab order. -->
      <button
        mat-button
        type="button"
        class="nx-i18n-caption-editor__toggle"
        data-testid="nx-i18n-caption-editor-toggle"
        [attr.aria-expanded]="expanded()"
        [attr.aria-controls]="extraIds"
        (click)="toggleExpanded()"
      >
        <mat-icon aria-hidden="true">{{ expanded() ? 'expand_less' : 'expand_more' }}</mat-icon>
        {{
          (expanded() ? 'shared.i18nCaptionEditor.fewerLanguages' : 'shared.i18nCaptionEditor.moreLanguages')
            | transloco
        }}
      </button>
    }
    <mat-form-field
      class="nx-i18n-caption-editor__row"
      subscriptSizing="dynamic"
      [id]="idPrefix + '-' + lang"
      [class.nx-i18n-caption-editor__row--extra]="isExtra(lang)"
    >
      <!-- No hand-made «*»: Material marks the required (de) label itself. -->
      <mat-label>{{ 'shared.i18nCaptionEditor.language.' + lang | transloco }}</mat-label>
      <input
        matInput
        type="text"
        [attr.data-lang]="lang"
        [formControl]="form.controls[lang]"
        [required]="lang === 'de'"
        (blur)="onBlur()"
      />
      <!-- mat-form-field shows it only in error state: touched, or the host form was submitted. -->
      @if (lang === 'de' && form.controls.de.invalid) {
        <mat-error data-testid="nx-i18n-caption-editor-de-error">{{
          'shared.i18nCaptionEditor.deRequired' | transloco
        }}</mat-error>
      }
    </mat-form-field>
  }
</div>
