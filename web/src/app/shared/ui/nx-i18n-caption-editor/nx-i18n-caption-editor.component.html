<div class="nx-i18n-caption-editor" role="group" [attr.aria-label]="'shared.i18nCaptionEditor.groupLabel' | transloco">
  @for (lang of languages; track lang) {
    <mat-form-field class="nx-i18n-caption-editor__row" subscriptSizing="dynamic">
      <!-- No hand-made «*»: Material marks the required (de) label itself. -->
      <mat-label>{{ 'shared.i18nCaptionEditor.language.' + lang | transloco }}</mat-label>
      <input
        matInput
        type="text"
        [attr.data-lang]="lang"
        [formControl]="form.controls[lang]"
        [required]="lang === 'de'"
        (blur)="onBlur()"
      />
      <!-- mat-form-field shows it only in error state: touched, or the host form was submitted. -->
      @if (lang === 'de' && form.controls.de.invalid) {
        <mat-error data-testid="nx-i18n-caption-editor-de-error">{{
          'shared.i18nCaptionEditor.deRequired' | transloco
        }}</mat-error>
      }
    </mat-form-field>
  }
</div>
