                      de: "Schweizer Franken"
                      en: "Swiss Franc"
                    minorUnits: 2
                    isActive: true
                page: 1
                pageSize: 50
                total: 4
        '400':
          $ref: '_shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: '_shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '_shared/components.yaml#/components/responses/Forbidden'
        '404':
          $ref: '_shared/components.yaml#/components/responses/NotFound'

  /v1/currencies/{code}:
    get:
      operationId: getCurrency
      summary: Detalle de una moneda.
      description: >
        No está en la lista literal de `org.md §5`, pero hace falta un
        detalle con `ETag` para que `PUT .../{code}` pueda exigir
        `If-Match` (conventions-api.md §1/§5) — sin este GET, un cliente
        nunca tendría de dónde sacar el ETag.
      tags: [Currencies]
      x-permission: "CURRENCY:READ"
      x-scope: none
      parameters:
        - $ref: '#/components/parameters/CurrencyCode'
      responses:
        '200':
          description: Moneda.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Currency'
              example:
                code: "CHF"
                captionI18n:
                  de: "Schweizer Franken"
                  en: "Swiss Franc"
                minorUnits: 2
                isActive: true
        '400':
          $ref: '_shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: '_shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '_shared/components.yaml#/components/responses/Forbidden'
        '404':
          $ref: '_shared/components.yaml#/components/responses/NotFound'
    put:
      operationId: updateCurrency
      summary: Activar o desactivar una moneda.
      description: >
        Único caso de uso de escritura sobre monedas: activar/desactivar
        (`isActive`). El resto de campos son fijos desde la semilla. No se
        puede desactivar una moneda en uso por un `Group`/`LegalEntity`
        activo (ORG-R7: ambos deben apuntar a una moneda activa).
      tags: [Currencies]
      x-permission: "CURRENCY:UPDATE"
      x-scope: none
      x-rules: [ORG-R7]
      parameters:
        - $ref: '#/components/parameters/CurrencyCode'
        - $ref: '_shared/components.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrencyRequest'
            example:
              isActive: false
      responses:
        '200':
          description: Moneda modificada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Currency'
              example:
                code: "GBP"
                captionI18n:
                  de: "Britisches Pfund"
                  en: "British Pound"
                minorUnits: 2
                isActive: false
        '400':
          $ref: '_shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: '_shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '_shared/components.yaml#/components/responses/Forbidden'
        '404':
          $ref: '_shared/components.yaml#/components/responses/NotFound'
        '409':
          $ref: '_shared/components.yaml#/components/responses/Conflict'
        '422':
          $ref: '_shared/components.yaml#/components/responses/UnprocessableEntity'
        '428':
          $ref: '_shared/components.yaml#/components/responses/PreconditionRequired'

  # ---------------------------------------------------------------------
  # Health
  # ---------------------------------------------------------------------
  /health:
    get:
      operationId: getHealth
      summary: Estado del servicio.
      description: >
        Comprobación de vida, sin autenticación (paso 0.5, track C — se
        crea aquí porque `platform.yaml` no existía todavía).
      tags: [Health]
      x-permission: "PUBLIC"
      security: []
      responses:
        '200':
          description: El servicio responde.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "up"
                required: [status]
              example:
                status: "up"

  # ---------------------------------------------------------------------
  # Me
  # ---------------------------------------------------------------------
  /v1/me:
    get:
      operationId: getMe
      summary: Información del usuario autenticado.
      description: >
        Forma base (`subject`, `oid`, `displayName`, `email`,
        `preferredLanguage`, `provisioned`, `permissions`) fijada por el
        paso 0.5, track C — se completa aquí porque `platform.yaml` no
        existía todavía. `userId`/`partyId`/`businessUnitId` son la
        ampliación de este paso 0.4: resuelve el `app_user` activo
        asociado al claim `oid` del token (ADR-0006) y los expone solo
        entonces (hasta que exista esa resolución en 0.4-B, viajan como
        `null` y `provisioned` es siempre `false`, tal como fija la ficha
        0.5). Si el `oid` no tiene un `app_user` activo, responde 403 con
        `Problem.code = "user_not_provisioned"` — nunca 200 con
        `provisioned: false` una vez exista la resolución. `permissions`
        sigue vacía hasta el paso 0.6.
      tags: [Me]
      x-permission: "AUTHENTICATED"
      x-scope: none
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                subject: "018f1a3c-7e3b-7c5a-9c2e-6a2f8e9b0c90"
                oid: "00000000-0000-7000-8000-00000000a002"
                displayName: "User A"
                email: "usera@dev.nexus.local"
                userId: "00000000-0000-7000-8000-0000000b0712"
                partyId: "00000000-0000-7000-8000-0000000b0112"
                businessUnitId: "00000000-0000-7000-8000-0000000b0401"
                preferredLanguage: "de"
                provisioned: true
                permissions: []
        '401':
          $ref: '_shared/components.yaml#/components/responses/Unauthorized'
        '403':
          description: >
            El `oid` del token no tiene un `app_user` activo asociado.
          content:
            application/problem+json:
              schema:
                $ref: '_shared/components.yaml#/components/schemas/Problem'
              example:
                type: "https://nexus.nussli.ch/problems/forbidden"
                title: "Usuario no provisionado"
                status: 403
                detail: "No existe un app_user activo para este token."
                code: "user_not_provisioned"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

    oidc:
      type: openIdConnect
      description: >
        Flujo interactivo (Authorization Code + PKCE, ADR-0006) para
        Swagger UI y clientes OIDC genéricos, descrito como
        `openIdConnect` en vez de `oauth2` explícito: una sola URL de
        descubrimiento (`.well-known/openid-configuration`) en lugar de
        fijar `authorizationUrl`/`tokenUrl` a mano — así "URLs
        parametrizadas" (la ficha de 0.5) es literal: cambiar de entorno
        es cambiar un solo valor, no dos. La URL de abajo es la del IdP
        de desarrollo local (Keycloak, `infra/compose`, realm `nexus`).
        En Azure, Entra ID usa otra `openIdConnectUrl` (y el scope real
        es `api://nexus/access_as_user`, no el nombre corto que usa
        Keycloak) — ADR-0006: "mismo código, solo cambia la
        configuración" (authority/clientId/scope), nunca este documento.
      openIdConnectUrl: http://localhost:8180/realms/nexus/.well-known/openid-configuration

  headers:
    ETag:
      description: Versión actual del recurso, para condicionar `If-Match`.
      schema:
        type: string
      example: '"1234567"'

  parameters:
    PartyId:
      name: id
      in: path
      required: true
      description: Id del party.
      schema:
        $ref: '_shared/components.yaml#/components/schemas/UuidV7'
    GroupId:
      name: id
      in: path
      required: true
      description: Id del group.
      schema:
        $ref: '_shared/components.yaml#/components/schemas/UuidV7'
    LegalEntityId:
      name: id
      in: path
      required: true
      description: Id de la legal entity.
      schema:
        $ref: '_shared/components.yaml#/components/schemas/UuidV7'
    BusinessUnitId:
      name: id
      in: path
      required: true
      description: Id de la business unit.
      schema:
        $ref: '_shared/components.yaml#/components/schemas/UuidV7'
    LocationId:
      name: id
      in: path
      required: true
      description: Id de la location.
      schema:
        $ref: '_shared/components.yaml#/components/schemas/UuidV7'
    WarehouseId:
      name: id
      in: path
      required: true
      description: Id del warehouse.
      schema:
        $ref: '_shared/components.yaml#/components/schemas/UuidV7'
    UserId:
      name: id
      in: path
      required: true
      description: Id del usuario.
      schema:
        $ref: '_shared/components.yaml#/components/schemas/UuidV7'
    CurrencyCode:
      name: code
      in: path
      required: true
      description: Código ISO 4217 de la moneda (3 letras mayúsculas).
      schema:
        type: string
        pattern: '^[A-Z]{3}$'
      example: "CHF"

  schemas:
    # --- Party ------------------------------------------------------------
    Party:
      type: object
      properties:
        id:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        partyType:
          type: string
          enum: [ORGANIZATION, PERSON]
        legalName:
          type: string
        displayName:
          type: [string, "null"]
        taxId:
          type: [string, "null"]
        erpCompanyCode:
          type: [string, "null"]
        isInternal:
          type: boolean
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, partyType, legalName, isInternal, isActive]

    PartyListItem:
      type: object
      properties:
        id:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        partyType:
          type: string
          enum: [ORGANIZATION, PERSON]
        legalName:
          type: string
        displayName:
          type: [string, "null"]
        isInternal:
          type: boolean
        isActive:
          type: boolean
      required: [id, partyType, legalName, isInternal, isActive]

    CreatePartyRequest:
      type: object
      properties:
        id:
          allOf:
            - $ref: '_shared/components.yaml#/components/schemas/UuidV7'
          description: Id opcional generado por el cliente (alta idempotente).
        partyType:
          type: string
          enum: [ORGANIZATION, PERSON]
        legalName:
          type: string
        displayName:
          type: [string, "null"]
        taxId:
          type: [string, "null"]
        erpCompanyCode:
          type: [string, "null"]
        isInternal:
          type: boolean
          default: false
      required: [partyType, legalName]

    UpdatePartyRequest:
      type: object
      description: >
        `partyType` e `isInternal` son inmutables tras la creación
        (ORG-R2) y no se exponen aquí.
      properties:
        legalName:
          type: string
        displayName:
          type: [string, "null"]
        taxId:
          type: [string, "null"]
        erpCompanyCode:
          type: [string, "null"]
      required: [legalName]

    # --- Group --------------------------------------------------------------
    Group:
      type: object
      properties:
        id:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        partyId:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        code:
          type: string
        consolidationMethod:
          type: string
          enum: [FULL, PROPORTIONAL, EQUITY]
        reportingCurrencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, partyId, code, consolidationMethod, reportingCurrencyCode]

    GroupListItem:
      type: object
      properties:
        id:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        partyId:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        code:
          type: string
        reportingCurrencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
      required: [id, partyId, code, reportingCurrencyCode]

    CreateGroupRequest:
      type: object
      properties:
        id:
          allOf:
            - $ref: '_shared/components.yaml#/components/schemas/UuidV7'
          description: Id opcional generado por el cliente (alta idempotente).
        legalName:
          type: string
          description: >
            Crea el `Party` interno (partyType=ORGANIZATION, isInternal=true,
            ORG-R1) en la misma operación — el Party no tiene vida propia
            fuera del Group.
        displayName:
          type: [string, "null"]
        code:
          type: string
        consolidationMethod:
          type: string
          enum: [FULL, PROPORTIONAL, EQUITY]
          default: FULL
        reportingCurrencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
      required: [legalName, code, reportingCurrencyCode]

    UpdateGroupRequest:
      type: object
      properties:
        code:
          type: string
        consolidationMethod:
          type: string
          enum: [FULL, PROPORTIONAL, EQUITY]
        reportingCurrencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
      required: [code, consolidationMethod, reportingCurrencyCode]

    # --- LegalEntity ----------------------------------------------------------
    LegalEntity:
      type: object
      properties:
        id:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        partyId:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        groupId:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        code:
          type: string
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, partyId, groupId, code, currencyCode, countryCode, isActive]

    LegalEntityListItem:
      type: object
      properties:
        id:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        groupId:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        code:
          type: string
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
        isActive:
          type: boolean
      required: [id, groupId, code, currencyCode, countryCode, isActive]

    CreateLegalEntityRequest:
      type: object
      properties:
        id:
          allOf:
            - $ref: '_shared/components.yaml#/components/schemas/UuidV7'
          description: Id opcional generado por el cliente (alta idempotente).
        legalName:
          type: string
          description: >
            Crea el `Party` interno (partyType=ORGANIZATION, isInternal=true,
            ORG-R1) en la misma operación.
        displayName:
          type: [string, "null"]
        groupId:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        code:
          type: string
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
      required: [legalName, groupId, code, currencyCode, countryCode]

    UpdateLegalEntityRequest:
      type: object
      properties:
        code:
          type: string
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
      required: [code, currencyCode, countryCode]

    # --- BusinessUnit ---------------------------------------------------------
    BusinessUnit:
      type: object
      properties:
        id:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        partyId:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        legalEntityId:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        code:
          type: string
        captionI18n:
          $ref: '_shared/components.yaml#/components/schemas/I18nText'
        costCenterCode:
          type: [string, "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, partyId, legalEntityId, code, captionI18n, isActive]

    BusinessUnitListItem:
      type: object
      properties:
        id:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        legalEntityId:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        code:
          type: string
        captionI18n:
          $ref: '_shared/components.yaml#/components/schemas/I18nText'
        isActive:
          type: boolean
      required: [id, legalEntityId, code, captionI18n, isActive]

    CreateBusinessUnitRequest:
      type: object
      properties:
        id:
          allOf:
            - $ref: '_shared/components.yaml#/components/schemas/UuidV7'
          description: Id opcional generado por el cliente (alta idempotente).
        legalName:
          type: string
          description: >
            Crea el `Party` interno (partyType=ORGANIZATION, isInternal=true,
            ORG-R1) en la misma operación.
        displayName:
          type: [string, "null"]
        legalEntityId:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        code:
          type: string
        captionI18n:
          $ref: '_shared/components.yaml#/components/schemas/I18nText'
        costCenterCode:
          type: [string, "null"]
      required: [legalName, legalEntityId, code, captionI18n]

    UpdateBusinessUnitRequest:
      type: object
      properties:
        code:
          type: string
        captionI18n:
          $ref: '_shared/components.yaml#/components/schemas/I18nText'
        costCenterCode:
          type: [string, "null"]
      required: [code, captionI18n]

    # --- Location ---------------------------------------------------------
    Location:
      type: object
      description: >
        Forma mínima de 0.4; `latitude`/`longitude` llegan en el paso 1.1.
      properties:
        id:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        code:
          type: [string, "null"]
        name:
          type: string
        street:
          type: [string, "null"]
        postalCode:
          type: [string, "null"]
        city:
          type: [string, "null"]
        region:
          type: [string, "null"]
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, countryCode, isActive]

    LocationListItem:
      type: object
      properties:
        id:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        code:
          type: [string, "null"]
        name:
          type: string
        city:
          type: [string, "null"]
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
        isActive:
          type: boolean
