        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, partyId, fullName, preferredLanguage, isActive]

    UserListItem:
      type: object
      properties:
        id:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        oid:
          type: [string, "null"]
        fullName:
          type: string
        email:
          type: [string, "null"]
        preferredLanguage:
          type: string
          enum: [de, en, fr, it, es]
        businessUnitId:
          type: [string, "null"]
          format: uuid
        isActive:
          type: boolean
      required: [id, fullName, preferredLanguage, isActive]

    CreateUserRequest:
      type: object
      description: >
        Crea el `Party` (PERSON) y el `app_user` asociado en la misma
        operación.
      properties:
        id:
          allOf:
            - $ref: '_shared/components.yaml#/components/schemas/UuidV7'
          description: Id opcional generado por el cliente (alta idempotente).
        oid:
          type: string
          description: Claim `oid` de Entra ID; mapea a `app_user.external_subject`.
        fullName:
          type: string
          description: Nombre completo de la persona (`party.legal_name`).
        email:
          type: [string, "null"]
        preferredLanguage:
          type: string
          enum: [de, en, fr, it, es]
          default: de
        businessUnitId:
          type: [string, "null"]
          format: uuid
      required: [oid, fullName, preferredLanguage]

    UpdateUserRequest:
      type: object
      properties:
        oid:
          type: [string, "null"]
          description: >
            Permite corregir el `oid` (`external_subject`) de un usuario,
            p. ej. tras un reaprovisionamiento en el IdP. `null` significa
            que el usuario no puede iniciar sesión (`org.md §3`); no es
            una regla de negocio (ORG-R6 solo dice que el usuario SYSTEM
            nunca se edita y nunca tiene `external_subject`).
        fullName:
          type: string
        email:
          type: [string, "null"]
        preferredLanguage:
          type: string
          enum: [de, en, fr, it, es]
        businessUnitId:
          type: [string, "null"]
          format: uuid
      required: [fullName, preferredLanguage]

    # --- Currency --------------------------------------------------------
    Currency:
      type: object
      properties:
        code:
          type: string
          pattern: '^[A-Z]{3}$'
        captionI18n:
          $ref: '_shared/components.yaml#/components/schemas/I18nText'
        minorUnits:
          type: integer
          minimum: 0
        isActive:
          type: boolean
      required: [code, captionI18n, minorUnits, isActive]

    CurrencyListItem:
      type: object
      properties:
        code:
          type: string
          pattern: '^[A-Z]{3}$'
        captionI18n:
          $ref: '_shared/components.yaml#/components/schemas/I18nText'
        minorUnits:
          type: integer
          minimum: 0
        isActive:
          type: boolean
      required: [code, captionI18n, minorUnits, isActive]

    UpdateCurrencyRequest:
      type: object
      properties:
        isActive:
          type: boolean
      required: [isActive]

    # --- Me ----------------------------------------------------------------
    Me:
      type: object
      description: >
        Forma base (`subject`, `oid`, `displayName`, `email`,
        `preferredLanguage`, `provisioned`, `permissions`) del paso 0.5;
        `userId`/`partyId`/`businessUnitId` son la ampliación del paso 0.4
        — nulos/ausentes mientras `nexus-platform` solo resuelve datos del
        token (0.5-B, antes de que exista la resolución real de
        `oid → app_user` de 0.4-B). `provisioned` es un `boolean` sin
        restringir a `true`: la ficha 0.5 fija que vale siempre `false`
        hasta que 0.4-B exista; solo entonces responde 200 con
        `provisioned: true` (o 403 `user_not_provisioned` si el `oid` no
        tiene un `app_user` activo — nunca 200 con `false`).
      properties:
        subject:
          type: string
          description: Claim `sub` del token (identificador técnico del IdP).
        oid:
          type: string
          description: Claim `oid` del token (`app_user.external_subject`).
        displayName:
          type: string
          description: Nombre para mostrar, tomado del token.
        email:
          type: [string, "null"]
          description: Email tomado del token (no de `app_user`).
        userId:
          type: [string, "null"]
          format: uuid
          description: Resuelto por 0.4-B. `null` hasta entonces.
        partyId:
          type: [string, "null"]
          format: uuid
          description: Resuelto por 0.4-B. `null` hasta entonces.
        businessUnitId:
          type: [string, "null"]
          format: uuid
        preferredLanguage:
          type: string
          enum: [de, en, fr, it, es]
        provisioned:
          type: boolean
        permissions:
          type: array
          description: Vacía hasta el paso 0.6.
          items:
            type: string
      required: [subject, oid, displayName, preferredLanguage, provisioned, permissions]
