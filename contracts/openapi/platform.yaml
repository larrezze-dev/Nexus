        locationId:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        legalEntityId:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        businessUnitId:
          type: [string, "null"]
          format: uuid
        code:
          type: string
        captionI18n:
          $ref: '_shared/components.yaml#/components/schemas/I18nText'
      required: [locationId, legalEntityId, code, captionI18n]

    UpdateWarehouseRequest:
      type: object
      properties:
        locationId:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        businessUnitId:
