      tags: [LegalEntities]
      x-permission: "ORG_STRUCTURE:READ"
      x-scope: none
      parameters:
        - $ref: '_shared/components.yaml#/components/parameters/Page'
        - $ref: '_shared/components.yaml#/components/parameters/PageSize'
