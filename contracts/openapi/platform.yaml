                code: "LE-CH"
                currencyCode: "CHF"
                countryCode: "CH"
                isActive: true
                createdAt: "2026-10-18T16:20:00Z"
                updatedAt: "2026-10-18T16:20:00Z"
        '201':
          description: Legal entity creada.
          headers:
            Location:
              description: URL del nuevo recurso.
              schema:
                type: string
              example: "/v1/legal-entities/018f1a3c-7e3b-7c5a-9c2e-6a2f8e9b0c40"
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalEntity'
              example:
