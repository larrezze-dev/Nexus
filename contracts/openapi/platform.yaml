                    partyId: "018f1a3c-7e3b-7c5a-9c2e-6a2f8e9b0c10"
                    code: "NUSSLI"
                    reportingCurrencyCode: "CHF"
                page: 1
                pageSize: 50
                total: 1
        '400':
          $ref: '_shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: '_shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '_shared/components.yaml#/components/responses/Forbidden'
        '404':
          $ref: '_shared/components.yaml#/components/responses/NotFound'
    post:
      operationId: createGroup
      summary: Crear un group.
      description: >
        Alta idempotente (`id` opcional, UUIDv7). Crea también el `Party`
        interno (`partyType = ORGANIZATION`, `isInternal = true`, ORG-R1) en
        la misma operación — el Party no tiene vida propia fuera del Group.
      tags: [Groups]
      x-permission: "ORG_STRUCTURE:CREATE"
      x-scope: none
      x-rules: [ORG-R1, ORG-R7]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
            example:
              legalName: "Nüssli Group"
              code: "NUSSLI"
              consolidationMethod: FULL
              reportingCurrencyCode: "CHF"
      responses:
        '200':
          description: Ya existía un group con el mismo `id` y contenido idéntico.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
              example:
                id: "018f1a3c-7e3b-7c5a-9c2e-6a2f8e9b0c30"
                partyId: "018f1a3c-7e3b-7c5a-9c2e-6a2f8e9b0c10"
                code: "NUSSLI"
                consolidationMethod: FULL
                reportingCurrencyCode: "CHF"
                createdAt: "2026-10-18T16:20:00Z"
                updatedAt: "2026-10-18T16:20:00Z"
        '201':
          description: Group creado.
          headers:
            Location:
              description: URL del nuevo recurso.
              schema:
                type: string
              example: "/v1/groups/018f1a3c-7e3b-7c5a-9c2e-6a2f8e9b0c30"
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
              example:
                id: "018f1a3c-7e3b-7c5a-9c2e-6a2f8e9b0c30"
                partyId: "018f1a3c-7e3b-7c5a-9c2e-6a2f8e9b0c10"
                code: "NUSSLI"
                consolidationMethod: FULL
                reportingCurrencyCode: "CHF"
                createdAt: "2026-10-18T16:20:00Z"
                updatedAt: "2026-10-18T16:20:00Z"
        '400':
          $ref: '_shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: '_shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '_shared/components.yaml#/components/responses/Forbidden'
        '404':
          $ref: '_shared/components.yaml#/components/responses/NotFound'
        '409':
          $ref: '_shared/components.yaml#/components/responses/Conflict'
        '422':
          $ref: '_shared/components.yaml#/components/responses/UnprocessableEntity'

