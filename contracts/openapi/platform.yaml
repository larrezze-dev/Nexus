          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
              example:
                id: "018f1a3c-7e3b-7c5a-9c2e-6a2f8e9b0c20"
                partyType: ORGANIZATION
                legalName: "Acme Events SA"
                displayName: "Acme Events"
                taxId: null
                erpCompanyCode: null
                isInternal: false
                isActive: true
                createdAt: "2026-10-18T16:20:00Z"
                updatedAt: "2026-10-18T16:20:00Z"
        '400':
          $ref: '_shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: '_shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '_shared/components.yaml#/components/responses/Forbidden'
        '404':
          $ref: '_shared/components.yaml#/components/responses/NotFound'
    put:
      operationId: updateParty
      summary: Modificar un party.
      description: Modificar un party.
      tags: [Parties]
      x-permission: "PARTY:UPDATE"
      x-scope: none
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - $ref: '_shared/components.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePartyRequest'
            example:
              legalName: "Acme Events SA"
              displayName: "Acme Events"
              taxId: "CHE-123.456.789"
              erpCompanyCode: "ACME01"
      responses:
        '200':
          description: Party modificado.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
              example:
                id: "018f1a3c-7e3b-7c5a-9c2e-6a2f8e9b0c20"
                partyType: ORGANIZATION
                legalName: "Acme Events SA"
                displayName: "Acme Events"
                taxId: "CHE-123.456.789"
                erpCompanyCode: "ACME01"
                isInternal: false
                isActive: true
                createdAt: "2026-10-18T16:20:00Z"
                updatedAt: "2026-10-19T08:05:00Z"
        '400':
          $ref: '_shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: '_shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '_shared/components.yaml#/components/responses/Forbidden'
        '404':
          $ref: '_shared/components.yaml#/components/responses/NotFound'
        '409':
          $ref: '_shared/components.yaml#/components/responses/Conflict'
        '422':
          $ref: '_shared/components.yaml#/components/responses/UnprocessableEntity'
        '428':
          $ref: '_shared/components.yaml#/components/responses/PreconditionRequired'

  /v1/parties/{id}/deactivate:
    post:
      operationId: deactivateParty
      summary: Desactivar un party.
      description: Desactivar un party.
      tags: [Parties]
      x-permission: "PARTY:UPDATE"
      x-scope: none
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - $ref: '_shared/components.yaml#/components/parameters/IfMatch'
      responses:
        '200':
          description: Party desactivado.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
              example:
                id: "018f1a3c-7e3b-7c5a-9c2e-6a2f8e9b0c20"
                partyType: ORGANIZATION
                legalName: "Acme Events SA"
                displayName: "Acme Events"
                taxId: "CHE-123.456.789"
                erpCompanyCode: "ACME01"
                isInternal: false
                isActive: false
                createdAt: "2026-10-18T16:20:00Z"
                updatedAt: "2026-10-19T09:00:00Z"
        '400':
          $ref: '_shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: '_shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '_shared/components.yaml#/components/responses/Forbidden'
        '404':
          $ref: '_shared/components.yaml#/components/responses/NotFound'
        '409':
          $ref: '_shared/components.yaml#/components/responses/Conflict'
        '422':
          $ref: '_shared/components.yaml#/components/responses/UnprocessableEntity'
        '428':
