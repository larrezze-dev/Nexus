openapi: 3.1.0
info:
  title: NEXUS Platform API
  version: "0.5.0"
  description: >
    Servicio `nexus-platform`: estructura organizativa (`org`) de NEXUS —
    directorio de Parties, Groups, Legal Entities, Business Units,
    Locations, Warehouses, Users y Currencies. Capa 1 del modelo de
    dominio (`docs/domain/org.md`). Alcance principal: paso 0.4 (núcleo).
    `GET /health` y la forma base de `GET /v1/me` se crearon ya en el
    paso 0.4, porque este documento no existía todavía cuando se
    ejecutó; 0.5 (track C) solo amplió `servers`/`securitySchemes`
    (`oidc`), sin recrear esas dos operaciones. Las operaciones de
    tipos de cambio, conversión de moneda y direcciones/relaciones de
    Party llegan en el paso 1.1.
  contact:
    name: NEXUS Platform Team
    email: nexus-platform@nussli.ch

servers:
  # Primera entrada = rootUrl por defecto de ng-openapi-gen (track F): debe ser
  # relativa para que funcione igual contra el gateway real (ng serve con
  # proxy.conf.json) y contra el mock de Prism (proxy.mock.json) sin reconfigurar
  # nada — conventions-api.md §1, ruta externa "/api/<servicio>/v1/<recurso>".
  - url: /api/platform
    description: Externo, vía gateway (YARP, paso 0.5 track B) o proxy de Angular
  - url: http://nexus-platform:5101
    description: Interno (dentro del clúster, directo al servicio)

tags:
  - name: Parties
    description: Directorio universal de entidades internas y externas.
  - name: Groups
    description: Grupo consolidador de Legal Entities.
  - name: LegalEntities
    description: Entidades legales del grupo.
  - name: BusinessUnits
    description: Unidades de negocio dentro de una Legal Entity.
  - name: Locations
    description: Ubicaciones físicas.
  - name: Warehouses
    description: Almacenes, ubicados y asignados a una Legal Entity.
  - name: Users
    description: Usuarios de la aplicación.
  - name: Currencies
    description: Catálogo de monedas.
  - name: Me
    description: Información del usuario autenticado.
  - name: Health
    description: Comprobación de vida del servicio.

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------
  # Parties
  # ---------------------------------------------------------------------
  /v1/parties:
    get:
      operationId: listParties
      summary: Listar parties del directorio.
      description: Listar parties del directorio.
      tags: [Parties]
      x-permission: "PARTY:READ"
      x-scope: none
      parameters:
        - $ref: '_shared/components.yaml#/components/parameters/Page'
        - $ref: '_shared/components.yaml#/components/parameters/PageSize'
        - $ref: '_shared/components.yaml#/components/parameters/Sort'
        - $ref: '_shared/components.yaml#/components/parameters/Q'
        - name: partyType
          in: query
          required: false
          description: Filtra por tipo de party.
          schema:
            type: string
            enum: [ORGANIZATION, PERSON]
          example: ORGANIZATION
        - name: isInternal
          in: query
          required: false
          description: Filtra por entidades internas (true) o externas (false) del grupo.
          schema:
            type: boolean
          example: true
      responses:
        '200':
          description: Página de parties.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '_shared/components.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/PartyListItem'
              example:
                items:
                  - id: "018f1a3c-7e3b-7c5a-9c2e-6a2f8e9b0c10"
                    partyType: ORGANIZATION
                    legalName: "Nüssli Group AG"
                    displayName: "Nüssli Group"
                    isInternal: true
                    isActive: true
                page: 1
                pageSize: 50
                total: 1
        '400':
          $ref: '_shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: '_shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '_shared/components.yaml#/components/responses/Forbidden'
        '404':
          $ref: '_shared/components.yaml#/components/responses/NotFound'
    post:
      operationId: createParty
      summary: Crear un party.
      description: >
        Alta idempotente: el cliente puede enviar `id` (UUIDv7). Si ya
        existe un party con ese `id` y contenido idéntico, responde 200
        con el recurso existente; si existe con contenido distinto,
        responde 409.
      tags: [Parties]
      x-permission: "PARTY:CREATE"
      x-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartyRequest'
            example:
              partyType: ORGANIZATION
              legalName: "Acme Events SA"
              displayName: "Acme Events"
              isInternal: false
      responses:
        '200':
          description: Ya existía un party con el mismo `id` y contenido idéntico.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
              example:
                id: "018f1a3c-7e3b-7c5a-9c2e-6a2f8e9b0c20"
                partyType: ORGANIZATION
                legalName: "Acme Events SA"
                displayName: "Acme Events"
                taxId: null
                erpCompanyCode: null
                isInternal: false
                isActive: true
                createdAt: "2026-10-18T16:20:00Z"
                updatedAt: "2026-10-18T16:20:00Z"
        '201':
          description: Party creado.
          headers:
            Location:
              description: URL del nuevo recurso.
              schema:
                type: string
              example: "/v1/parties/018f1a3c-7e3b-7c5a-9c2e-6a2f8e9b0c20"
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
              example:
                id: "018f1a3c-7e3b-7c5a-9c2e-6a2f8e9b0c20"
                partyType: ORGANIZATION
                legalName: "Acme Events SA"
                displayName: "Acme Events"
                taxId: null
                erpCompanyCode: null
                isInternal: false
                isActive: true
                createdAt: "2026-10-18T16:20:00Z"
                updatedAt: "2026-10-18T16:20:00Z"
        '400':
          $ref: '_shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: '_shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '_shared/components.yaml#/components/responses/Forbidden'
        '404':
          $ref: '_shared/components.yaml#/components/responses/NotFound'
        '409':
          $ref: '_shared/components.yaml#/components/responses/Conflict'
        '422':
          $ref: '_shared/components.yaml#/components/responses/UnprocessableEntity'

  /v1/parties/{id}:
    get:
      operationId: getParty
      summary: Obtener un party por id.
      description: Obtener un party por id.
      tags: [Parties]
      x-permission: "PARTY:READ"
      x-scope: none
