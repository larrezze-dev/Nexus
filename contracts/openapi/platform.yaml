        region:
          type: [string, "null"]
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
      required: [name, countryCode]

    UpdateLocationRequest:
      type: object
      properties:
        code:
          type: [string, "null"]
        name:
          type: string
        street:
          type: [string, "null"]
        postalCode:
          type: [string, "null"]
        city:
          type: [string, "null"]
        region:
          type: [string, "null"]
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
      required: [name, countryCode]

    # --- Warehouse -----------------------------------------------------------
    Warehouse:
      type: object
      properties:
        id:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        locationId:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        legalEntityId:
          $ref: '_shared/components.yaml#/components/schemas/UuidV7'
        businessUnitId:
          type: [string, "null"]
          format: uuid
        code:
          type: string
        captionI18n:
          $ref: '_shared/components.yaml#/components/schemas/I18nText'
        isActive:
