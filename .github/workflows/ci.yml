name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # `make contracts` now also runs ng-openapi-gen (step 0.5 track F), which resolves from
      # web/node_modules/.bin -- not npx -- so web's own dependencies must be installed first.
      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Lint contracts (Spectral + permissions) and generate the Angular client
        run: make contracts

  dotnet:
    name: dotnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: src/Directory.Packages.props

      - name: Build
        run: dotnet build src/Nexus.sln

      - name: Test
        run: dotnet test --solution src/Nexus.sln

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      # The Angular client under web/src/app/api/ is generated from contracts/openapi/*.yaml
      # (step 0.5 track F, ng-openapi-gen) and is gitignored, not committed -- lint/test/build
      # below need it to exist, the same way a developer runs `make contracts` locally first.
      - name: Generate the Angular API client
        run: make contracts

      - name: Lint
        run: npm --prefix web run lint

      - name: Test
        run: npm --prefix web test -- --watch=false

      - name: Build
        run: npm --prefix web run build

  packages:
    name: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check approved NuGet packages
        run: bash tools/check-packages.sh

  db:
    name: db
    runs-on: ubuntu-latest
    # Throwaway credentials for the ephemeral CI Postgres service container. They are
    # not real secrets: the container exists only for this job and is discarded after it.
    # Nothing here is written into SQL; every password reaches psql/flyway as a variable.
    env:
      PG_SUPERUSER_PASSWORD: ci_only_superuser_pw
      NEXUS_MIGRATOR_PASSWORD: ci_only_migrator_pw
      NEXUS_SVC_PLATFORM_PASSWORD: ci_only_svc_platform_pw
      NEXUS_SVC_CATALOG_PASSWORD: ci_only_svc_catalog_pw
      NEXUS_SVC_OPERATIONS_PASSWORD: ci_only_svc_operations_pw
      NEXUS_SVC_COMMERCIAL_PASSWORD: ci_only_svc_commercial_pw
      NEXUS_SVC_RESOURCES_PASSWORD: ci_only_svc_resources_pw
      NEXUS_SVC_CONTROLLING_PASSWORD: ci_only_svc_controlling_pw
      NEXUS_SVC_FIELD_PASSWORD: ci_only_svc_field_pw
      NEXUS_SVC_RELAY_PASSWORD: ci_only_svc_relay_pw
      NEXUS_SVC_SOLVER_PASSWORD: ci_only_svc_solver_pw
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: nexus
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ env.PG_SUPERUSER_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships the psql client. Connects as the bootstrap superuser.
      # db/bootstrap/00_roles.sql reads each role's password itself, via `\set x
      # `echo "$NEXUS_..._PASSWORD"`` -- a shell command substitution that inherits
      # psql's own process environment, not `-v name=value`. All 10 NEXUS_*_PASSWORD
      # variables are already in this job's env (see `env:` above), so nothing more
      # is needed here beyond PGPASSWORD for psql's own connection to Postgres.
      - name: Bootstrap roles (as superuser)
        env:
          PGPASSWORD: ${{ env.PG_SUPERUSER_PASSWORD }}
        run: |
          psql -X -v ON_ERROR_STOP=1 \
            -h localhost -p 5432 -U postgres -d nexus \
            -f db/bootstrap/00_roles.sql

      # Same Flyway image and conventions as `make db-migrate`, but on the host network
      # because the service is published on localhost:5432 (no compose network here).
      # The password goes in via -e FLYWAY_PASSWORD (value from env, not argv).
      # Ownership: db/migrations/afterConnect.sql is a Flyway callback (not a
      # migration) that runs `SET ROLE nexus_owner` after every connection, so
      # objects created here are owned by nexus_owner, not nexus_migrator.
      - name: Flyway migrate
        env:
          FLYWAY_PASSWORD: ${{ env.NEXUS_MIGRATOR_PASSWORD }}
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/db:/flyway/sql:ro" \
            -e FLYWAY_PASSWORD \
            flyway/flyway:13.11.1-alpine \
            -url=jdbc:postgresql://localhost:5432/nexus \
            -user=nexus_migrator \
            -locations=filesystem:/flyway/sql/migrations \
            migrate

      - name: Flyway validate
        env:
          FLYWAY_PASSWORD: ${{ env.NEXUS_MIGRATOR_PASSWORD }}
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/db:/flyway/sql:ro" \
            -e FLYWAY_PASSWORD \
            flyway/flyway:13.11.1-alpine \
            -url=jdbc:postgresql://localhost:5432/nexus \
            -user=nexus_migrator \
            -locations=filesystem:/flyway/sql/migrations \
            validate

      # Each DBC-N check is a SELECT that returns one row per violation; the script's
      # own \warn banners go to stderr (not captured here), so -q -At -- quiet, tuples
      # only, unaligned -- leaves `out` empty on a clean run and non-empty on any
      # violation. ON_ERROR_STOP makes a SQL error in the script fail the step too.
      - name: Schema checks (db/ci/checks.sql)
        env:
          PGPASSWORD: ${{ env.NEXUS_MIGRATOR_PASSWORD }}
        run: |
          out=$(psql -X -q -At -v ON_ERROR_STOP=1 \
            -h localhost -p 5432 -U nexus_migrator -d nexus \
            -f db/ci/checks.sql)
          if [ -n "$out" ]; then
            echo "$out"
            echo "db/ci/checks.sql returned violation rows"
            exit 1
          fi

  conformance:
    name: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: src/Directory.Packages.props

      # `dotnet run` (not publish+exec): the setup-dotnet SDK is already here, the service
      # doesn't need a self-contained artifact for this check, and this keeps the job doing
      # exactly what a developer running `make run-backend` locally does. appsettings.json
      # already ships a valid (if fictitious) Nexus:Authentication:Authority/Audience, so no
      # extra env vars are needed for the host to register the JWT bearer scheme and start --
      # confirmed by running the service with no overrides.
      # Backgrounded with `&`; its PID is captured so the cleanup step can stop it explicitly
      # rather than relying on the runner to reap it when the job ends.
      # `--project <path>` alone does NOT make that directory the content root: ASP.NET
      # Core resolves appsettings.json relative to the process's working directory, which
      # `dotnet run --project` leaves at $GITHUB_WORKSPACE (the caller's cwd), not the
      # project's own folder. Without `working-directory` here the host throws
      # "Missing configuration 'Nexus:Authentication:Authority'" before /health ever comes
      # up - reproduced locally with the exact command below run from the repo root.
      - name: Start Nexus.Platform.Api
        working-directory: src/Platform/Nexus.Platform.Api
        run: |
          dotnet run --no-launch-profile &
          echo "PLATFORM_API_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for /health
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:5101/health > /dev/null; do sleep 1; done'

      - name: Download the service's real OpenAPI document
        run: |
          curl -sf http://localhost:5101/openapi/v1.json -o platform-actual.json

      # contracts/openapi/platform.yaml is intentionally ahead of the service (contract-first,
      # ADR-0005): it already defines ~27 operations while nexus-platform only implements 2
      # (GET /health, GET /v1/me). oasdiff direction matters here -- base is what the service
      # exposes TODAY, revision is the full contract -- so operations the contract defines but
      # the service doesn't implement yet are additions (never breaking); only a change to the
      # shape of an operation the service already implements would be.
      # --err-ignore tools/oasdiff-err-ignore.txt: one documented, per-endpoint exception (see
      # that file's header) for a known gap between the custom `x-permission` OpenAPI
      # extension this step's services use and oasdiff's standard-`security`-based breaking
      # change detection -- not a blanket suppression, every other finding still fails the job.
      - name: oasdiff breaking (service vs. contract)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            tufin/oasdiff:v1.35.0-rc.1 breaking --fail-on ERR \
            --err-ignore /workspace/tools/oasdiff-err-ignore.txt \
            /workspace/platform-actual.json \
            /workspace/contracts/openapi/platform.yaml

      - name: Stop Nexus.Platform.Api
        if: always()
        run: |
          if [ -n "${PLATFORM_API_PID:-}" ]; then
            kill "$PLATFORM_API_PID" 2>/dev/null || true
          fi

  jvm:
    name: jvm
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "pendiente: paso 4.4"'

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start local infra
        run: make up

      - run: 'echo "pendiente: paso 1.3 (tests e2e en sí)"'
